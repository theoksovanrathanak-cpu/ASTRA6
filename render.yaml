services:
  - type: web
    name: astra6
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # optional - leave blank to use the free public real-data chain only
      - key: OANDA_API_KEY
        sync: false
      - key: OANDA_ACCOUNT_ID
        sync: false
      - key: OANDA_ENVIRONMENT
        value: practice
      # optional notifications
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: EMAIL_WEBHOOK_URL
        sync: false
      # optional persistence of users.json / tokens.json across deploys
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO_URL
        value: https://github.com/theoksovanrathanak-cpu/ASTRA6.git
      # real-data chain never invent prices
      - key: PYTHON_VERSION
        value: "3.11.9"
